# =====================================================================
#  MediCore Healthcare ERP Lakehouse  —  Databricks Asset Bundle
#  Deploy:   databricks bundle validate -t dev
#            databricks bundle deploy   -t dev
#            databricks bundle run hc_erp_end_to_end -t dev
# =====================================================================
bundle:
  name: hc_erp_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the healthcare ERP
    default: hc_erp_dev
  warehouse_id:
    description: SQL Warehouse ID used by SQL tasks, Genie and the App
    default: "<YOUR_WAREHOUSE_ID>"
  notification_email:
    description: Who gets job failure alerts
    default: "<YOUR_EMAIL>"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<YOUR_WORKSPACE_HOST>
    variables:
      catalog: hc_erp_dev

  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: hc_erp_prod
    run_as:
      service_principal_name: "<hc-erp-prod-sp-application-id>"
